# Nahid Meet: compila o frontend e publica a imagem web em ghcr.io/rodrigonahid/nahid-meet-web.
name: Imagem web (Nahid Meet)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'android/**'
      - 'ios/**'
      - 'react-native-sdk/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: nahid-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nahid-meet-web
  # Mantenha igual à tag do upstream usada como base e à JITSI_IMAGE_VERSION do deploy.
  JITSI_VERSION: stable-11248

jobs:
  build:
    if: github.repository == 'rodrigonahid/nahid-meet'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: JITSI_VERSION=${{ env.JITSI_VERSION }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.JITSI_VERSION }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
